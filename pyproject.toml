[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sage-study"
dynamic = ["version"]
description = "A personal study assistant: quizzes, study guides, and video playlists from your own material. Works with Claude Code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11,<3.14"
keywords = ["study", "quiz", "flashcards", "education"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Intended Audience :: Education",
    "Topic :: Education",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "pydantic>=2.7,<3",
    "platformdirs>=4,<5",
    "pypdf>=4.2,<7",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "pillow>=10.4,<13",
    "pywebview>=5.3,<7",
    "httpx>=0.27,<1",
    "httpcore>=1.0,<2",
    "lxml>=5,<7",
    "trafilatura>=2.0,<3",
    "youtube-transcript-api>=1.2,<2",
    "keyring>=25,<26",
]

[project.urls]
Homepage = "https://github.com/kfcasey7/sage-study"
Issues = "https://github.com/kfcasey7/sage-study/issues"
Changelog = "https://github.com/kfcasey7/sage-study/blob/main/CHANGELOG.md"

[project.scripts]
sage-study = "sage.cli:main"

[project.gui-scripts]
sage-study-gui = "sage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "fpdf2>=2.7",
    "ruff>=0.6",
]
packaging = [
    "pyinstaller>=6.10",
]

[tool.hatch.version]
path = "backend/sage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["backend/sage"]
exclude = ["__pycache__"]

[tool.hatch.build.targets.sdist]
include = ["backend/sage", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "constraints.txt"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["backend"]
extend-exclude = ["backend/sage/web", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "B905",   # zip() without strict= is fine for the short, known-length lists here
    "E501",   # long lines are common in prompts and SQL
    "E741",
    "B008",   # FastAPI's Depends/File defaults
]
